<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная работа №2</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    h1 { color: #1e40af; }
    #hostname { color: #475569; }
  </style>
</head>
<body>
  <h1>Лабораторная работа №2</h1>
  <p>Фронтенд и бэкенд в Docker Compose</p>
  <p id="message" role="status">Получаю сообщение…</p>
  <p id="hostname"></p>

  <script>
    const message = document.getElementById("message");

    fetch("/api/message", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        message.textContent = data.message;
        document.getElementById("hostname").textContent =
          `Контейнер бэкенда: ${data.hostname}`;
      })
      .catch(() => {
        message.textContent = "Не удалось получить данные от бэкенда.";
      });
  </script>
</body>
</html>

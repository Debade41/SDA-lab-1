services:
  backend:
    build: ./backend
    image: sda-lab2-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/message', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    image: sda-lab2-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
